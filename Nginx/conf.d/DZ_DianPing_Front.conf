server {
    listen       80;
    server_name  localhost;

    root   "F:/nginx-1.30.6/html/DZ_DianPing_Front";
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 后端当前把新博客图片保存到该目录。
    location ^~ /imgs/blogs/ {
        alias "D:/tlias/nginx-1.18.0 dianping/html/hmdp/imgs/blogs/";
        error_page 404 = @frontend_blog_images;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 后端上传目录不存在时，回退到构建产物中的示例博客图片。
    location @frontend_blog_images {
        root "F:/nginx-1.30.6/html/DZ_DianPing_Front";
        try_files $uri =404;
    }

    # 前端构建产物中的默认图片、图标和店铺类型图片。
    location ^~ /imgs/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # /api/user/login -> http://127.0.0.1:8080/user/login
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
